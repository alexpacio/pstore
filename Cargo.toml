[package]
name = "pstore"
version = "0.1.0"
edition = "2024"
description = "Versioned prompt editor that scores the coding-agent models and effort levels installed on your machine"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.5", features = ["derive"] }
dirs = "6.0.0"
eframe = "0.36.0"
egui = "0.36.0"
egui_commonmark = "0.25.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.1.2"

# Everything below serves one job: fetch the model weights and the `llama-cli` that runs
# them. Optional, so `cargo build --no-default-features` stays fast and dependency-light —
# that build simply has no local inference, and the features needing it are disabled.
#
# Blocking HTTP for both downloads: the checkpoint from Hugging Face and the llama-cli
# release from GitHub. pstore deliberately has no async runtime, so a blocking client is
# what the worker threads want.
#
# This replaced `hf-hub`, which stalls deterministically 11 MB into the 3.8 GB checkpoint
# (see src/router/hub.rs). Only the crate is gone — the cache *layout* is still Hugging
# Face's, so other tools keep sharing the weights.
ureq = { version = "3.2.1", optional = true, default-features = false, features = [
  "rustls",
  "gzip",
] }
# Verifying the release asset against its published SHA256 before it is unpacked and run.
sha2 = { version = "0.10.9", optional = true }
# Unpacking that asset. In-process rather than shelling out to `tar`, so archive entries
# are checked before they land: `tar`'s unpack refuses paths that escape the destination,
# which matters for an archive fetched over the network.
tar = { version = "0.4.44", optional = true }
flate2 = { version = "1.1.9", optional = true }

[features]
default = ["local-llm"]
# Local inference: fetch the checkpoint and the llama-cli runtime, and use them.
local-llm = [
  "dep:ureq",
  "dep:sha2",
  "dep:tar",
  "dep:flate2",
  "dep:zip",
]

# The Windows release assets are zips rather than tarballs.
[target.'cfg(target_os = "windows")'.dependencies]
zip = { version = "8.6.0", optional = true, default-features = false, features = [
  "deflate",
] }

[profile.release]
# The UI should feel immediate and the binary ships as one file.
opt-level = 3
lto = "thin"
strip = true
