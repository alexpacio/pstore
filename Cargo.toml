[package]
name = "pstore"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Versioned prompt editor that scores the coding-agent models and effort levels installed on your machine"
license = "Apache-2.0"
repository = "https://github.com/alexpacio/pstore"

# One crate, three front ends. The library is the whole of pstore except its presentation —
# see src/lib.rs — and the binary is a command-line dispatcher over it.
[lib]
name = "pstore"
path = "src/lib.rs"

[[bin]]
name = "pstore"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.5", features = ["derive"] }
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.1.2"

# The window. Optional because the TUI and the CLI are complete front ends without it, and on a
# headless machine — a server, a container, a remote checkout over ssh — the GUI's dependency tree
# is the largest thing in the build and none of it can run.
eframe = { version = "0.36.0", optional = true }
egui = { version = "0.36.0", optional = true }
egui_commonmark = { version = "0.25.0", optional = true }

# The terminal. `ratatui` draws, `crossterm` owns the terminal itself — raw mode, the alternate
# screen, and the key events.
ratatui = { version = "0.30.1", optional = true, default-features = false, features = [
  "crossterm",
] }
crossterm = { version = "0.29.0", optional = true }

# Everything below serves one job: fetch the model weights and the `llama-cli` that runs
# them. Not optional. Ranking, planning, shrinking and the personal-data scan are all the
# local checkpoint — a build without it is not a smaller pstore, it is a text editor that
# refuses every button. The build that used to exist behind `--no-default-features` could
# compile and start and then fail at the first thing anyone opened it to do.
#
# Blocking HTTP for both downloads: the checkpoint from Hugging Face and the llama-cli
# release from GitHub. pstore deliberately has no async runtime, so a blocking client is
# what the worker threads want.
#
# This replaced `hf-hub`, which stalls deterministically 11 MB into the 3.8 GB checkpoint
# (see src/router/hub.rs). Only the crate is gone — the cache *layout* is still Hugging
# Face's, so other tools keep sharing the weights.
ureq = { version = "3.2.1", default-features = false, features = [
  "rustls",
  "gzip",
] }
# Verifying the release asset against its published SHA256 before it is unpacked and run.
sha2 = "0.10.9"
# Unpacking that asset. In-process rather than shelling out to `tar`, so archive entries
# are checked before they land: `tar`'s unpack refuses paths that escape the destination,
# which matters for an archive fetched over the network.
tar = "0.4.44"
flate2 = "1.1.9"

[features]
default = ["gui", "tui"]

# The native window. `cargo build --no-default-features --features tui` gives a build with
# no windowing dependencies at all, which is what a headless machine wants.
gui = ["dep:eframe", "dep:egui", "dep:egui_commonmark"]

# The terminal interface.
tui = ["dep:ratatui", "dep:crossterm"]

# The Windows release assets are zips rather than tarballs.
[target.'cfg(target_os = "windows")'.dependencies]
zip = { version = "8.6.0", default-features = false, features = [
  "deflate",
] }

[profile.release]
# The UI should feel immediate and the binary ships as one file.
opt-level = 3
lto = "thin"
strip = true
